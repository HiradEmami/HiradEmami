<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100">
  <defs>
    <radialGradient id="g-ai">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .t{font:600 12px 'Segoe UI'; fill:#e2e8f0; letter-spacing:2px;}

      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes dash-1 { from { stroke-dashoffset: 420px; } to { stroke-dashoffset: 0; } }
      .dash-1 { animation: dash-1 2.8s linear infinite; }
      @keyframes pulse-1 { 0%, 100% { r: 24px; } 50% { r: 32px; } }
      .pulse-1 { animation: pulse-1 6s linear infinite; }
      @keyframes pulse-2 { 0%, 100% { r: 18px; } 50% { r: 26px; } }
      .pulse-2 { animation: pulse-2 4s linear infinite; }
      @keyframes spin-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin-1 { transform-origin: 70px 50px; animation: spin-1 8s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        [stroke="url(#borderGradSmall)"] { stroke: url(#borderGradSmallStill); }
      }
    </style>
  </defs>

  <!-- base -->
  <!-- Neon animated border -->
    <linearGradient id="borderGradSmall">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        values="-120 0;120 0;-120 0"
        dur="3s"
        repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGradSmallStill" href="#borderGradSmall" gradientTransform="translate(0 0)"/>
      <!-- base fill -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="#020617"/>

    <!-- animated neon border -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="none"
          stroke="url(#borderGradSmall)"
          stroke-width="1.8"
          stroke-dasharray="420"
          stroke-dashoffset="420"
          filter="url(#glow)"
          class="dash-1"/>

  <!-- ambient field -->
  <circle cx="70" cy="50" r="28"
          fill="#22d3ee" opacity="0.05"
          class="pulse-1"/>

  <circle cx="70" cy="50" r="20"
          fill="#8b5cf6" opacity="0.05"
          class="pulse-2"/>

  <!-- core -->
  <circle cx="70" cy="50" r="10"
          fill="url(#g-ai)"
          filter="url(#glow)"/>

  <!-- rotating cognition ring -->
  <circle cx="70" cy="50" r="18"
          fill="none"
          stroke="#67e8f9"
          stroke-opacity="0.25"
          stroke-dasharray="6 10"
          class="spin-1"/>

  <!-- label -->
  <text x="185" y="55" text-anchor="middle" class="t">AI DOMAINS</text>
</svg>