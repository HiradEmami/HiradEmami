<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100">
  <defs>
    <linearGradient id="g-blog" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>.t{font:600 12px 'Segoe UI'; fill:#e2e8f0; letter-spacing:2px;}
      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes dash-1 { from { stroke-dashoffset: 420px; } to { stroke-dashoffset: 0; } }
      .dash-1 { animation: dash-1 2.8s linear infinite; }
      @keyframes scan-1 { 0%, 100% { y: 35px; } 50% { y: 65px; } }
      .scan-1 { animation: scan-1 2s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        [stroke="url(#borderGradSmall)"] { stroke: url(#borderGradSmallStill); }
      }
    </style>
  </defs>

  <!-- base -->
  <!-- Neon animated border -->
    <linearGradient id="borderGradSmall">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform"
        type="translate"
        values="-120 0;120 0;-120 0"
        dur="3s"
        repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGradSmallStill" href="#borderGradSmall" gradientTransform="translate(0 0)"/>
      <!-- base fill -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="#020617"/>

    <!-- animated neon border -->
    <rect x="10" y="20" width="280" height="60" rx="12"
          fill="none"
          stroke="url(#borderGradSmall)"
          stroke-width="1.8"
          stroke-dasharray="420"
          stroke-dashoffset="420"
          filter="url(#glow)"
          class="dash-1"/>

  <!-- scan lines -->
  <rect x="45" y="35" width="40" height="2" fill="url(#g-blog)" class="scan-1"/>

  <text x="170" y="55" text-anchor="middle" class="t">BLOGS</text>
</svg>