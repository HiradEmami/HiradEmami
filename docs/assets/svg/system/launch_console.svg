<svg width="1180" height="260" viewBox="0 0 1180 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.86"/>
      <stop offset="82%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-140 0;140 0;-140 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="scanGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <pattern id="terminalGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#38bdf8" stroke-opacity="0.04"/>
    </pattern>

    <filter id="glow" x="-30%" y="-35%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .chrome {
        font: 800 12px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 4px;
        fill: #67e8f9;
      }
      .prompt {
        font: 800 18px 'Cascadia Mono', Consolas, monospace;
        fill: #67e8f9;
      }
      .line {
        font: 800 24px 'Cascadia Mono', Consolas, monospace;
        fill: #e0f2fe;
      }
      .muted {
        font: 700 16px 'Cascadia Mono', Consolas, monospace;
        fill: #94a3b8;
      }
      .status {
        font: 900 18px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 2px;
        fill: #bbf7d0;
      }
    </style>
  </defs>

  <rect width="1180" height="260" rx="26" fill="url(#bg)"/>
  <rect width="1180" height="260" rx="26" fill="url(#terminalGrid)"/>
  <circle cx="590" cy="135" r="235" fill="url(#scanGlow)">
    <animate attributeName="r" values="218;246;218" dur="12s" repeatCount="indefinite"/>
  </circle>

  <rect x="7" y="7" width="1166" height="246" rx="22" fill="none" stroke="url(#frame)" stroke-width="2.2" stroke-opacity="0.72" stroke-dasharray="420 120" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-540" dur="22s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(28 26)">
    <circle cx="0" cy="0" r="5" fill="#f43f5e"/>
    <circle cx="20" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="40" cy="0" r="5" fill="#22c55e"/>
    <text x="72" y="5" class="chrome">HIRAD SYSTEM / LAUNCH CONSOLE</text>
  </g>

  <g transform="translate(74 82)" filter="url(#glow)">
    <text x="0" y="0" class="prompt">&gt;</text>
    <text x="34" y="0" class="line">HIRAD SYSTEM ONLINE</text>
    <rect x="356" y="-21" width="12" height="28" rx="2" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0.12;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="55" class="prompt">&gt;</text>
    <text x="34" y="55" class="line">LABS:</text>
    <text x="126" y="55" class="line" fill="#93c5fd">NEURAL</text>
    <text x="235" y="55" class="muted">/</text>
    <text x="270" y="55" class="line" fill="#99f6e4">MOLECULE</text>
    <text x="414" y="55" class="muted">/</text>
    <text x="450" y="55" class="line" fill="#fde68a">MODEL FORGE</text>

    <text x="0" y="110" class="prompt">&gt;</text>
    <text x="34" y="110" class="line">STATUS:</text>
    <text x="146" y="110" class="status">OPEN TO COLLABORATION</text>
  </g>

  <g transform="translate(820 68)">
    <rect width="270" height="124" rx="18" fill="rgba(2, 6, 23, 0.72)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M32 84H238" stroke="url(#frame)" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 18" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-176" dur="15s" repeatCount="indefinite"/>
    </path>
    <circle cx="70" cy="84" r="13" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="135" cy="84" r="13" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="84" r="13" fill="#22c55e" filter="url(#glow)">
      <animate attributeName="r" values="12;14;12" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="135" y="38" text-anchor="middle" class="chrome">ROUTE ACTIVE</text>
  </g>
</svg>
