<svg width="1400" height="680" viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile Architecture</title>
  <desc id="desc">A system map showing the profile path from README to Website, Projects, Labs, AI Domains, and Collaboration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="46%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>

    <linearGradient id="frameLine" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="23%" stop-color="#22d3ee" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="#a78bfa" stop-opacity="0.72"/>
      <stop offset="78%" stop-color="#22c55e" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="routeLine" x1="150" y1="0" x2="1250" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="24%" stop-color="#38bdf8"/>
      <stop offset="44%" stop-color="#a78bfa"/>
      <stop offset="63%" stop-color="#34d399"/>
      <stop offset="82%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.17"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <pattern id="mesh" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity="0.035"/>
      <circle cx="6" cy="7" r="1" fill="#67e8f9" opacity="0.12"/>
    </pattern>

    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelShadow" x="-18%" y="-22%" width="136%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#020617" flood-opacity="0.58"/>
    </filter>

    <style>
      .eyebrow{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#67e8f9}
      .titleText{font:900 38px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .nodeTitle{font:900 20px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .nodeMeta{font:800 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2.4px;fill:#93c5fd}
      .nodeText{font:650 12px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .terminal{font:800 13px 'Cascadia Mono',Consolas,monospace;fill:#bbf7d0}
      .tiny{font:800 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#64748b}
    </style>
  </defs>

  <rect width="1400" height="680" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="680" rx="30" fill="url(#mesh)"/>
  <circle cx="700" cy="390" r="300" fill="url(#coreGlow)">
    <animate attributeName="r" values="286;316;286" dur="12s" repeatCount="indefinite"/>
  </circle>

  <rect x="20" y="20" width="1360" height="640" rx="26" fill="none" stroke="url(#frameLine)" stroke-width="2.2" stroke-opacity="0.66" stroke-dasharray="520 150" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-670" dur="24s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(56 54)">
    <text x="0" y="0" class="eyebrow">PROFILE ARCHITECTURE</text>
    <text x="0" y="48" class="titleText">SYSTEM ROUTE MAP</text>
    <text x="0" y="78" class="subtitle">A compact route map from first impression to technical depth, live labs, AI focus areas, and collaboration entry points.</text>
  </g>

  <g transform="translate(1008 50)">
    <rect width="320" height="64" rx="18" fill="rgba(2,6,23,0.74)" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="26" class="terminal">&gt; route.profile --public</text>
    <text x="24" y="48" class="tiny">DISCOVERY / DEPTH / CONTACT</text>
  </g>

  <path d="M150 390C285 268 420 268 555 390S820 512 955 390S1180 270 1250 380" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round" opacity="0.88"/>
  <path d="M150 390C285 268 420 268 555 390S820 512 955 390S1180 270 1250 380" fill="none" stroke="url(#routeLine)" stroke-width="7" stroke-linecap="round" opacity="0.88"/>
  <path d="M150 390C285 268 420 268 555 390S820 512 955 390S1180 270 1250 380" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 34" opacity="0.74" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="16s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#panelShadow)">
    <g transform="translate(62 314)">
      <path d="M18 0H162L190 28V126L166 150H0V18Z" fill="rgba(2,6,23,0.86)" stroke="#22d3ee" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">ENTRY</text>
      <text x="24" y="68" class="nodeTitle">README</text>
      <text x="24" y="100" class="nodeText">First signal</text>
      <text x="24" y="120" class="nodeText">and routing hub</text>
      <circle cx="150" cy="116" r="14" fill="#22d3ee" filter="url(#glow)">
        <animate attributeName="r" values="13;15;13" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(286 230)">
      <path d="M20 0H172L198 26V126L174 150H0V20Z" fill="rgba(2,6,23,0.84)" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">PORTAL</text>
      <text x="24" y="68" class="nodeTitle">Website</text>
      <text x="24" y="100" class="nodeText">Main system</text>
      <text x="24" y="120" class="nodeText">and live pages</text>
      <circle cx="158" cy="116" r="12" fill="#38bdf8" opacity="0.86"/>
    </g>

    <g transform="translate(510 314)">
      <path d="M20 0H174L202 28V126L176 150H0V20Z" fill="rgba(2,6,23,0.84)" stroke="#a78bfa" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">INDEX</text>
      <text x="24" y="68" class="nodeTitle">Projects</text>
      <text x="24" y="100" class="nodeText">Build logs, systems,</text>
      <text x="24" y="120" class="nodeText">and experiments</text>
      <circle cx="160" cy="116" r="12" fill="#a78bfa" opacity="0.86"/>
    </g>

    <g transform="translate(734 438)">
      <path d="M20 0H172L198 26V126L174 150H0V20Z" fill="rgba(2,6,23,0.85)" stroke="#34d399" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">PLAYGROUND</text>
      <text x="24" y="68" class="nodeTitle">Labs</text>
      <text x="24" y="100" class="nodeText">Neural, Molecule,</text>
      <text x="24" y="120" class="nodeText">and Model Forge</text>
      <circle cx="158" cy="116" r="12" fill="#34d399" opacity="0.86"/>
    </g>

    <g transform="translate(958 314)">
      <path d="M20 0H184L212 28V126L188 150H0V20Z" fill="rgba(2,6,23,0.84)" stroke="#f59e0b" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">TECHNICAL CORE</text>
      <text x="24" y="68" class="nodeTitle">AI Domains</text>
      <text x="24" y="100" class="nodeText">ML systems, MLOps,</text>
      <text x="24" y="120" class="nodeText">RL, robotics, infra</text>
      <circle cx="170" cy="116" r="12" fill="#f59e0b" opacity="0.86"/>
    </g>

    <g transform="translate(1128 228)">
      <path d="M20 0H166L194 28V126L170 150H0V20Z" fill="rgba(2,6,23,0.85)" stroke="#fb7185" stroke-width="2"/>
      <text x="24" y="34" class="nodeMeta">HANDSHAKE</text>
      <text x="24" y="68" class="nodeTitle">Collaboration</text>
      <text x="24" y="100" class="nodeText">Good-fit work</text>
      <text x="24" y="120" class="nodeText">and contact path</text>
      <circle cx="154" cy="116" r="14" fill="#fb7185" filter="url(#glow)">
        <animate attributeName="r" values="13;15;13" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(96 610)">
    <rect width="1208" height="34" rx="17" fill="rgba(2,6,23,0.74)" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="22" class="terminal">&gt; README -> Website -> Projects -> Labs -> AI Domains -> Collaboration</text>
  </g>
</svg>
