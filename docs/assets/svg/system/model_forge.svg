<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f59e0b"/><stop offset="42%" stop-color="#a78bfa"/><stop offset="72%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f59e0b"/><animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="14s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="edgeStill" href="#edge" gradientTransform="translate(0 0)"/>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#fde68a}.title{font:900 42px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#c4b5fd}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#fef3c7}
      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes dash-1 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -426px; } }
      .dash-1 { animation: dash-1 16s linear infinite; }
      @keyframes spin-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin-1 { transform-origin: 97px 82px; animation: spin-1 18s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        [stroke="url(#edge)"] { stroke: url(#edgeStill); }
      }
    </style>
  </defs>
  <rect width="760" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="748" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="340 86" stroke-linecap="round" class="dash-1"/>
  <g transform="translate(72 55)" filter="url(#glow)">
    <path d="M26 120H168M48 94H146M72 68H122M92 42H104" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <rect x="18" y="126" width="158" height="20" rx="10" fill="#f59e0b"/>
    <path d="M44 30H150L126 126H68Z" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="97" cy="82" r="22" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 8" class="spin-1"/>
  </g>
  <text x="280" y="74" class="meta">ML FOUNDATIONS WORKSHOP</text>
  <text x="280" y="126" class="title">MODEL FORGE</text>
  <text x="280" y="161" class="desc">Learn core machine learning concepts.</text>
  <g transform="translate(280 190)"><rect width="118" height="26" rx="13" fill="#1e1b4b" stroke="#f59e0b" stroke-opacity=".55"/><text x="59" y="18" text-anchor="middle" class="tag">CONCEPTS</text></g>
  <g transform="translate(412 190)"><rect width="104" height="26" rx="13" fill="#1e1b4b" stroke="#22d3ee" stroke-opacity=".55"/><text x="52" y="18" text-anchor="middle" class="tag">MODELS</text></g>
</svg>
