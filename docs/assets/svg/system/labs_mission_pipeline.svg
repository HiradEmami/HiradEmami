<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity=".9"/>
      <stop offset="78%" stop-color="#22c55e" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity=".4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-opacity=".04"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".6"/>
    </filter>
    <style>
      .kicker{font:800 14px 'Segoe UI',Arial,sans-serif;letter-spacing:5px;fill:#67e8f9}
      .title{font:900 44px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#f8fafc}
      .subtitle{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .stepTitle{font:900 22px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .stepText{font:650 15px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .meta{font:800 11px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}
      .terminal{font:800 15px 'Cascadia Mono',Consolas,monospace;fill:#bbf7d0}
    </style>
  </defs>

  <rect width="1500" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1500" height="620" rx="34" fill="url(#grid)"/>
  <rect x="24" y="24" width="1452" height="572" rx="30" fill="none" stroke="url(#flow)" stroke-width="2.4" stroke-opacity=".68" stroke-dasharray="520 150" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-670" dur="24s" repeatCount="indefinite"/>
  </rect>

  <text x="750" y="72" text-anchor="middle" class="kicker">LAB OPERATING MODEL</text>
  <text x="750" y="126" text-anchor="middle" class="title">FROM CONCEPT TO INTERACTIVE SYSTEM</text>
  <text x="750" y="160" text-anchor="middle" class="subtitle">The labs should make hard ideas visible, testable, and easier to reason about.</text>

  <path d="M160 310H1340" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="28 20" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-192" dur="16s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#shadow)">
    <g transform="translate(90 225)">
      <path d="M0 0H250L290 40V170H0Z" fill="rgba(2,6,23,.82)" stroke="url(#edge)" stroke-width="2"/>
      <text x="24" y="38" class="meta">01 / INPUT</text>
      <text x="24" y="76" class="stepTitle">DIRECT CONTROL</text>
      <text x="24" y="112" class="stepText">Change atoms, neurons,</text>
      <text x="24" y="136" class="stepText">parameters, or model choices.</text>
    </g>
    <g transform="translate(410 225)">
      <path d="M0 0H250L290 40V170H0Z" fill="rgba(2,6,23,.82)" stroke="url(#edge)" stroke-width="2"/>
      <text x="24" y="38" class="meta">02 / FEEDBACK</text>
      <text x="24" y="76" class="stepTitle">VISIBLE RESPONSE</text>
      <text x="24" y="112" class="stepText">Show behavior, structure,</text>
      <text x="24" y="136" class="stepText">state, and consequences.</text>
    </g>
    <g transform="translate(730 225)">
      <path d="M0 0H250L290 40V170H0Z" fill="rgba(2,6,23,.82)" stroke="url(#edge)" stroke-width="2"/>
      <text x="24" y="38" class="meta">03 / INTUITION</text>
      <text x="24" y="76" class="stepTitle">LEARN BY SEEING</text>
      <text x="24" y="112" class="stepText">Turn abstract concepts</text>
      <text x="24" y="136" class="stepText">into inspectable patterns.</text>
    </g>
    <g transform="translate(1050 225)">
      <path d="M0 0H250L290 40V170H0Z" fill="rgba(2,6,23,.82)" stroke="url(#edge)" stroke-width="2"/>
      <text x="24" y="38" class="meta">04 / SYSTEM</text>
      <text x="24" y="76" class="stepTitle">BUILD THE MODEL</text>
      <text x="24" y="112" class="stepText">Connect the lesson back</text>
      <text x="24" y="136" class="stepText">to real engineering work.</text>
    </g>
  </g>

  <g transform="translate(260 455)">
    <rect width="980" height="54" rx="27" fill="rgba(2,6,23,.82)" stroke="url(#flow)" stroke-width="1.6" stroke-opacity=".58"/>
    <text x="34" y="34" class="terminal">&gt; roadmap: standalone labs + clearer demos + grounded concepts + connected ecosystem</text>
  </g>
</svg>
