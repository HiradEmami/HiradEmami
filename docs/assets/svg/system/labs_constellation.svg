<svg width="1500" height="880" viewBox="0 0 1500 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#22c55e" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-180 0;180 0;-180 0" dur="13s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="neural" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="molecule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.1" fill="#67e8f9" opacity="0.18"/>
      <circle cx="56" cy="46" r="1" fill="#a78bfa" opacity="0.16"/>
      <path d="M72 0H0V72" fill="none" stroke="#38bdf8" stroke-opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
    <style>
      .kicker{font:800 14px 'Segoe UI',Arial,sans-serif;letter-spacing:5px;fill:#67e8f9}
      .title{font:900 48px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#f8fafc}
      .subtitle{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .labTitle{font:900 26px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .labMeta{font:800 11px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}
      .labText{font:650 15px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .terminal{font:800 15px 'Cascadia Mono',Consolas,monospace;fill:#bbf7d0}
    </style>
  </defs>

  <rect width="1500" height="880" rx="34" fill="url(#bg)"/>
  <rect width="1500" height="880" rx="34" fill="url(#stars)"/>
  <circle cx="750" cy="410" r="360" fill="url(#coreGlow)">
    <animate attributeName="r" values="340;380;340" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="24" y="24" width="1452" height="832" rx="30" fill="none" stroke="url(#signal)" stroke-width="2.4" stroke-opacity=".68" stroke-dasharray="520 150" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-670" dur="24s" repeatCount="indefinite"/>
  </rect>

  <text x="750" y="72" text-anchor="middle" class="kicker">INTERACTIVE LAB NETWORK</text>
  <text x="750" y="130" text-anchor="middle" class="title">LABS BUILT FOR DIRECT INTUITION</text>
  <text x="750" y="164" text-anchor="middle" class="subtitle">Three environments for exploring systems through manipulation, feedback, and visual reasoning.</text>

  <g stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 18" opacity=".75" filter="url(#glow)">
    <path d="M750 392C620 330 498 318 360 360"/>
    <path d="M750 392C888 315 1018 310 1140 360"/>
    <path d="M750 392C750 510 750 555 750 625"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="16s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(626 280)" filter="url(#glow)">
    <circle cx="124" cy="112" r="104" fill="rgba(2,6,23,.84)" stroke="url(#signal)" stroke-width="3"/>
    <circle cx="124" cy="112" r="68" fill="none" stroke="#22d3ee" stroke-opacity=".68" stroke-width="2" stroke-dasharray="20 14">
      <animateTransform attributeName="transform" type="rotate" from="0 124 112" to="360 124 112" dur="22s" repeatCount="indefinite"/>
    </circle>
    <text x="124" y="102" text-anchor="middle" class="labMeta">LAB CORE</text>
    <text x="124" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="900" fill="#f8fafc">TOUCH IDEAS</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(95 245)">
      <path d="M40 0H420L470 50V230L430 270H0V40Z" fill="rgba(2,6,23,.83)" stroke="url(#neural)" stroke-width="2.5"/>
      <text x="34" y="44" class="labMeta">LAB 01 / NEURAL SYSTEMS</text>
      <text x="34" y="88" class="labTitle">NEURAL LAB</text>
      <text x="34" y="124" class="labText">Interactive neural visualization</text>
      <text x="34" y="148" class="labText">for model behavior, activation flow,</text>
      <text x="34" y="172" class="labText">and intuition through experimentation.</text>
      <path d="M330 196C365 155 405 150 432 180C402 225 360 226 330 196Z" fill="none" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="382" cy="190" r="20" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    </g>

    <g transform="translate(935 245)">
      <path d="M50 0H470V230L430 270H0V50Z" fill="rgba(2,6,23,.83)" stroke="url(#molecule)" stroke-width="2.5"/>
      <text x="34" y="44" class="labMeta">LAB 02 / ATOMIC BUILDER</text>
      <text x="34" y="88" class="labTitle">MOLECULE LAB</text>
      <text x="34" y="124" class="labText">Build molecules from atoms,</text>
      <text x="34" y="148" class="labText">bonds, structures, and direct</text>
      <text x="34" y="172" class="labText">scientific interaction.</text>
      <path d="M332 190L388 160L432 205M388 160L394 226" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="332" cy="190" r="17" fill="#0f766e" stroke="#99f6e4" stroke-width="3"/>
      <circle cx="388" cy="160" r="22" fill="#14532d" stroke="#86efac" stroke-width="3"/>
      <circle cx="432" cy="205" r="16" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="394" cy="226" r="13" fill="#052e16" stroke="#bbf7d0" stroke-width="3"/>
    </g>

    <g transform="translate(515 560)">
      <path d="M40 0H430L480 48V170L438 212H0V40Z" fill="rgba(2,6,23,.86)" stroke="url(#forge)" stroke-width="2.5"/>
      <text x="34" y="42" class="labMeta">LAB 03 / ML FOUNDATIONS</text>
      <text x="34" y="86" class="labTitle">MODEL FORGE</text>
      <text x="34" y="122" class="labText">A guided workshop for learning</text>
      <text x="34" y="146" class="labText">core machine learning concepts,</text>
      <text x="34" y="170" class="labText">models, and workflow foundations.</text>
      <path d="M346 58H430L414 158H362Z" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <path d="M344 160H434" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="388" cy="112" r="22" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 8">
        <animateTransform attributeName="transform" type="rotate" from="0 388 112" to="360 388 112" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g transform="translate(452 815)">
    <rect width="596" height="40" rx="20" fill="rgba(2,6,23,.82)" stroke="url(#signal)" stroke-width="1.5" stroke-opacity=".58"/>
    <text x="28" y="26" class="terminal">&gt; lab method: manipulate -> observe -> understand -> build</text>
  </g>
</svg>
