<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeFlow" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edgeFlowStill" href="#edgeFlow" gradientTransform="translate(0 0)"/>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="greenFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity="0.055" stroke-width="1" class="drift-1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .eyebrow {
        font: 700 16px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 5px;
        fill: #67e8f9;
      }
      .headline {
        font: 800 58px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 3px;
        fill: #f8fafc;
      }
      .subhead {
        font: 500 20px 'Segoe UI', Arial, sans-serif;
        fill: #94a3b8;
      }
      .panelTitle {
        font: 800 27px 'Segoe UI', Arial, sans-serif;
        fill: #e0f2fe;
      }
      .panelMeta {
        font: 700 13px 'Segoe UI', Arial, sans-serif;
        letter-spacing: 3px;
        fill: #67e8f9;
      }
      .item {
        font: 600 18px 'Segoe UI', Arial, sans-serif;
        fill: #dbeafe;
      }
      .small {
        font: 600 15px 'Segoe UI', Arial, sans-serif;
        fill: #94a3b8;
      }
      .terminal {
        font: 700 17px 'Cascadia Mono', Consolas, monospace;
        fill: #bbf7d0;
      }
      .panel {
        fill: rgba(2, 6, 23, 0.76);
        stroke: url(#cyanPurple);
        stroke-width: 2;
      }
      .panelBack {
        fill: rgba(15, 23, 42, 0.62);
        stroke: #1e293b;
        stroke-width: 1.5;
      }
      .route {
        fill: none;
        stroke: url(#edgeFlow);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 18 18;
        filter: url(#glow);
      }
      .minorRoute {
        fill: none;
        stroke: #334155;
        stroke-width: 1.5;
        stroke-dasharray: 8 14;
      }

      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes drift-1 { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(44px, 44px); } }
      .drift-1 { animation: drift-1 24s linear infinite; }
      @keyframes pulse-1 { 0%, 100% { r: 315px; opacity: 0.72; } 50% { r: 350px; opacity: 0.9; } }
      .pulse-1 { animation: pulse-1 12s linear infinite; }
      @keyframes dash-1 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -464px; } }
      .dash-1 { animation: dash-1 24s linear infinite; }
      @keyframes pulse-2 { 0%, 100% { r: 2.5px; } 50% { r: 4px; } }
      .pulse-2 { animation: pulse-2 7s linear infinite; }
      @keyframes pulse-3 { 0%, 100% { r: 2.5px; } 50% { r: 4px; } }
      .pulse-3 { animation: pulse-3 8s linear infinite; }
      @keyframes pulse-4 { 0%, 100% { r: 2.5px; } 50% { r: 4px; } }
      .pulse-4 { animation: pulse-4 9s linear infinite; }
      @keyframes pulse-5 { 0%, 100% { r: 2.5px; } 50% { r: 4px; } }
      .pulse-5 { animation: pulse-5 7.5s linear infinite; }
      @keyframes dash-2 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -144px; } }
      .dash-2 { animation: dash-2 15s linear infinite; }
      @keyframes dash-3 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -144px; } }
      .dash-3 { animation: dash-3 16s linear infinite; }
      @keyframes dash-4 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -144px; } }
      .dash-4 { animation: dash-4 17s linear infinite; }
      @keyframes dash-5 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -144px; } }
      .dash-5 { animation: dash-5 14s linear infinite; }
      @keyframes spin-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin-1 { transform-origin: 162px 162px; animation: spin-1 22s linear infinite; }
      @keyframes spin-2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      .spin-2 { transform-origin: 162px 162px; animation: spin-2 14s linear infinite; }
      @keyframes pulse-6 { 0%, 100% { r: 36px; } 50% { r: 40px; } }
      .pulse-6 { animation: pulse-6 8s linear infinite; }
      @keyframes dash-6 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -320px; } }
      .dash-6 { animation: dash-6 18s linear infinite; }
      @keyframes dash-7 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -320px; } }
      .dash-7 { animation: dash-7 21s linear infinite; }
      @keyframes dash-8 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -320px; } }
      .dash-8 { animation: dash-8 20s linear infinite; }
      @keyframes dash-9 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -320px; } }
      .dash-9 { animation: dash-9 23s linear infinite; }
      @keyframes dash-10 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -236px; } }
      .dash-10 { animation: dash-10 18s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        [stroke="url(#edgeFlow)"] { stroke: url(#edgeFlowStill); }
        .route { stroke: url(#edgeFlowStill); }
      }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="34" fill="url(#grid)"/>
  <circle cx="800" cy="440" r="330" fill="url(#coreGlow)" class="pulse-1"/>

  <rect x="28" y="28" width="1544" height="844" rx="30" fill="none" stroke="url(#edgeFlow)" stroke-width="3" stroke-dasharray="190 42" stroke-linecap="round" class="dash-1"/>

  <g opacity="0.75">
    <circle cx="180" cy="130" r="3" fill="#22d3ee" filter="url(#glow)" class="pulse-2"/>
    <circle cx="1410" cy="146" r="3" fill="#a78bfa" filter="url(#glow)" class="pulse-3"/>
    <circle cx="250" cy="748" r="3" fill="#f472b6" filter="url(#glow)" class="pulse-4"/>
    <circle cx="1355" cy="760" r="3" fill="#22d3ee" filter="url(#glow)" class="pulse-5"/>
  </g>

  <text x="800" y="92" text-anchor="middle" class="eyebrow">COLLABORATION MATRIX</text>
  <text x="800" y="158" text-anchor="middle" class="headline">BUILDING REAL AI SYSTEMS</text>
  <text x="800" y="195" text-anchor="middle" class="subhead">MLOps platforms • research tooling • RL systems • robotics infrastructure</text>

  <path class="minorRoute" d="M350 330C495 255 620 255 724 382"/>
  <path class="minorRoute" d="M1250 330C1105 255 980 255 876 382"/>
  <path class="minorRoute" d="M350 575C500 666 630 648 727 504"/>
  <path class="minorRoute" d="M1250 575C1100 666 970 648 873 504"/>

  <path class="route dash-2" d="M377 345C510 285 632 300 726 399"/>
  <path class="route dash-3" d="M1223 345C1090 285 968 300 874 399"/>
  <path class="route dash-4" d="M377 572C518 650 641 620 728 494"/>
  <path class="route dash-5" d="M1223 572C1082 650 959 620 872 494"/>

  <g transform="translate(638 292)" filter="url(#softGlow)">
    <circle cx="162" cy="162" r="142" fill="rgba(2, 6, 23, 0.72)" stroke="url(#edgeFlow)" stroke-width="3"/>
    <circle cx="162" cy="162" r="104" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="10 14" class="spin-1"/>
    <circle cx="162" cy="162" r="72" fill="none" stroke="#22d3ee" stroke-opacity="0.72" stroke-width="2" stroke-dasharray="28 16" class="spin-2"/>
    <circle cx="162" cy="162" r="38" fill="url(#cyanPurple)" opacity="0.95" class="pulse-6"/>
    <text x="162" y="151" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#020617">OPEN</text>
    <text x="162" y="177" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#020617">BUILD</text>
  </g>

  <g transform="translate(95 250)">
    <rect x="10" y="12" width="440" height="210" rx="20" class="panelBack"/>
    <rect x="0" y="0" width="440" height="210" rx="20" class="panel dash-6" stroke-dasharray="128 32" stroke-linecap="round"/>
    <text x="32" y="45" class="panelMeta">DOMAIN 01</text>
    <text x="32" y="86" class="panelTitle">ML INFRASTRUCTURE</text>
    <circle cx="38" cy="125" r="5" fill="#22d3ee"/>
    <text x="58" y="131" class="item">Model serving and deployment</text>
    <circle cx="38" cy="160" r="5" fill="#8b5cf6"/>
    <text x="58" y="166" class="item">Experimentation platforms</text>
    <circle cx="38" cy="195" r="5" fill="#f472b6"/>
    <text x="58" y="201" class="item">Production MLOps pipelines</text>
  </g>

  <g transform="translate(1065 250)">
    <rect x="-10" y="12" width="440" height="210" rx="20" class="panelBack"/>
    <rect x="0" y="0" width="440" height="210" rx="20" class="panel dash-7" stroke-dasharray="128 32" stroke-linecap="round"/>
    <text x="32" y="45" class="panelMeta">DOMAIN 02</text>
    <text x="32" y="86" class="panelTitle">RESEARCH SYSTEMS</text>
    <circle cx="38" cy="125" r="5" fill="#22d3ee"/>
    <text x="58" y="131" class="item">PaperOps and reproducibility</text>
    <circle cx="38" cy="160" r="5" fill="#8b5cf6"/>
    <text x="58" y="166" class="item">RL and multi-agent labs</text>
    <circle cx="38" cy="195" r="5" fill="#f472b6"/>
    <text x="58" y="201" class="item">Evaluation and benchmark flows</text>
  </g>

  <g transform="translate(95 535)">
    <rect x="10" y="12" width="440" height="210" rx="20" class="panelBack"/>
    <rect x="0" y="0" width="440" height="210" rx="20" class="panel dash-8" stroke-dasharray="128 32" stroke-linecap="round"/>
    <text x="32" y="45" class="panelMeta">SIGNAL 03</text>
    <text x="32" y="86" class="panelTitle">WHO FITS</text>
    <circle cx="38" cy="125" r="5" fill="#22d3ee"/>
    <text x="58" y="131" class="item">Engineers building real systems</text>
    <circle cx="38" cy="160" r="5" fill="#8b5cf6"/>
    <text x="58" y="166" class="item">Researchers who ship tooling</text>
    <circle cx="38" cy="195" r="5" fill="#f472b6"/>
    <text x="58" y="201" class="item">Long-term collaborators</text>
  </g>

  <g transform="translate(1065 535)">
    <rect x="-10" y="12" width="440" height="210" rx="20" class="panelBack"/>
    <rect x="0" y="0" width="440" height="210" rx="20" class="panel dash-9" stroke-dasharray="128 32" stroke-linecap="round"/>
    <text x="32" y="45" class="panelMeta">PROTOCOL 04</text>
    <text x="32" y="86" class="panelTitle">HOW I WORK</text>
    <circle cx="38" cy="125" r="5" fill="#22d3ee"/>
    <text x="58" y="131" class="item">Clear scope and ownership</text>
    <circle cx="38" cy="160" r="5" fill="#8b5cf6"/>
    <text x="58" y="166" class="item">High standards, low ego</text>
    <circle cx="38" cy="195" r="5" fill="#f472b6"/>
    <text x="58" y="201" class="item">Systems that outlive demos</text>
  </g>

  <g transform="translate(470 765)">
    <rect width="660" height="78" rx="18" fill="rgba(2, 6, 23, 0.82)" stroke="url(#greenFlow)" stroke-width="2" stroke-dasharray="90 28" class="dash-10"/>
    <text x="34" y="33" class="terminal">&gt; handshake --mode focused --standard production</text>
    <text x="34" y="59" class="small">Open to aligned work in AI platforms, MLOps, RL, robotics, and research infrastructure.</text>
  </g>

  <g opacity="0.62" filter="url(#glow)">
    <path d="M180 820H430" stroke="url(#edgeFlow)" stroke-width="2"/>
    <path d="M1170 820H1420" stroke="url(#edgeFlow)" stroke-width="2"/>
    <circle cx="430" cy="820" r="4" fill="#22d3ee"/>
    <circle cx="1170" cy="820" r="4" fill="#a78bfa"/>
  </g>
</svg>
