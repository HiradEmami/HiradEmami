<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="grad" x1="0" x2="1000">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font: 700 26px monospace;
        fill: #e2e8f0;
        letter-spacing: 3px;
      }
      .sub {
        font: 400 12px monospace;
        fill: #64748b;
        letter-spacing: 2px;
      }

      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes dash-1 { from { stroke-dashoffset: 1520px; } to { stroke-dashoffset: 0; } }
      .dash-1 { animation: dash-1 3s linear infinite; }
      @keyframes spin-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin-1 { transform-origin: 500px 60px; animation: spin-1 6s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        /* spin-1 replaces the group's transform attribute; rest it on a frame of that orbit (off-canvas) */
        .spin-1 { transform: rotate(90deg); }
      }
    </style>
  </defs>

  <!-- lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#1e293b" stroke-width="2"/>
  <line x1="600" y1="60" x2="1000" y2="60" stroke="#1e293b" stroke-width="2"/>

  <!-- animated energy -->
  <line x1="0" y1="60" x2="1000" y2="60"
        stroke="url(#grad)" stroke-width="2"
        stroke-dasharray="120 1400"
        class="dash-1"/>

  <!-- center node -->
  <g transform="translate(500,60)" filter="url(#glow)" class="spin-1">
    <circle r="14" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle r="6" fill="#22d3ee"/>
  </g>

  <!-- text -->
  <text x="500" y="40" text-anchor="middle" class="title">
    SYSTEM ACCESS
  </text>

  <text x="500" y="95" text-anchor="middle" class="sub">
    entry points • external systems • interfaces
  </text>

</svg>