<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <radialGradient id="energy">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .title { font:700 36px 'Segoe UI'; fill:#f8fafc; letter-spacing:2px; }
      .subtitle { font:500 16px 'Segoe UI'; fill:#94a3b8; }
      .cta { font:600 14px 'Segoe UI'; fill:#22d3ee; letter-spacing:2px; }

      /* Motion. CSS-driven so it stops under prefers-reduced-motion: docs/meta/MOTION_SYSTEM.md */
      @keyframes pulse-1 { 0%, 100% { r: 28px; opacity: 0.6; } 50% { r: 34px; opacity: 0.9; } }
      .pulse-1 { animation: pulse-1 3s linear infinite; }
      @keyframes dash-1 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 60px; } }
      .dash-1 { animation: dash-1 2.5s linear infinite; }
      @keyframes pulse-2 { 0%, 100% { r: 60px; opacity: 0.2; } 50% { r: 85px; opacity: 0.35; } }
      .pulse-2 { animation: pulse-2 4s linear infinite; }
      @keyframes spin-1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin-1 { animation: spin-1 12s linear infinite; }
      @keyframes spin-2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      .spin-2 { animation: spin-2 18s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="500" height="650" fill="url(#bg)"/>

  <!-- energy sources -->
  <circle cx="120" cy="260" r="30" fill="#22d3ee" opacity="0.7" filter="url(#glow)" class="pulse-1"/>

  <circle cx="380" cy="260" r="30" fill="#8b5cf6" opacity="0.7" filter="url(#glow)" class="pulse-1"/>

  <!-- flowing energy paths -->
  <path d="M120 260 Q250 180 250 260"
        stroke="#22d3ee"
        stroke-opacity="0.4"
        stroke-width="2"
        stroke-dasharray="6 10"
        fill="none"
        class="dash-1"/>

  <path d="M380 260 Q250 340 250 260"
        stroke="#8b5cf6"
        stroke-opacity="0.4"
        stroke-width="2"
        stroke-dasharray="6 10"
        fill="none"
        class="dash-1"/>

  <!-- forming core -->
  <g transform="translate(250,260)">
    <circle r="70" fill="url(#energy)" opacity="0.25" filter="url(#glow)" class="pulse-2"/>

    <!-- rotating rings -->
    <g class="spin-1">
      <circle r="90"
              fill="none"
              stroke="#67e8f9"
              stroke-opacity="0.25"
              stroke-dasharray="40 20"/>
    </g>

    <g class="spin-2">
      <circle r="110"
              fill="none"
              stroke="#8b5cf6"
              stroke-opacity="0.2"
              stroke-dasharray="60 30"/>
    </g>
  </g>

  <!-- text -->
  <text x="250" y="430" text-anchor="middle" class="title">
    COLLABORATION
  </text>

  <text x="250" y="470" text-anchor="middle" class="subtitle">
    convergence • shared systems • building together
  </text>

  <text x="250" y="520" text-anchor="middle" class="cta">
    CONNECT →
  </text>
</svg>