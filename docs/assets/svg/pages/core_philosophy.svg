<svg width="344" height="224" viewBox="0 0 344 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Philosophy</title>
  <desc id="desc">Principles and mindset: systems over models, reproducibility is non-negotiable, and if it doesn’t scale, it doesn’t exist.</desc>
  <defs>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="48%" stop-color="#22d3ee"/>
      <stop offset="72%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <style>
      .section{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:1px}
      .sectionSub{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .item{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#dbeafe}
      .bullet{fill:#22d3ee}
    </style>
  </defs>

  <rect x="2" y="2" width="340" height="220" rx="18" fill="#030819" stroke="url(#panelStroke)" stroke-width="2"/>

  <text x="37" y="52" class="section">PHILOSOPHY</text>
  <text x="37" y="75" class="sectionSub">Principles &amp; mindset</text>

  <circle cx="44" cy="109" r="3.5" class="bullet"/>
  <text x="60" y="114" class="item">Systems &gt; models</text>

  <circle cx="44" cy="149" r="3.5" class="bullet"/>
  <text x="60" y="154" class="item">Reproducibility is non-negotiable</text>

  <circle cx="44" cy="189" r="3.5" class="bullet"/>
  <text x="60" y="194" class="item">If it doesn’t scale, it doesn’t exist</text>
</svg>
