<svg width="420" height="86" viewBox="0 0 420 86" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Explore Labs Button</title>
  <desc id="desc">A glowing button labeled Explore Labs for opening the dedicated labs page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="420" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="52%" stop-color="#a78bfa" stop-opacity="0.82"/>
      <stop offset="78%" stop-color="#22c55e" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-72 0;72 0;-72 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowCore" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="58%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-55%" width="150%" height="210%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font:900 25px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#f8fafc}
      .meta{font:800 9px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}
      .arrow{font:900 25px 'Cascadia Mono',Consolas,monospace;fill:#bbf7d0}
    </style>
  </defs>

  <rect x="3" y="3" width="414" height="80" rx="22" fill="url(#bg)"/>
  <rect x="18" y="12" width="384" height="62" rx="18" fill="url(#glowCore)" opacity="0.95">
    <animate attributeName="opacity" values="0.72;0.95;0.72" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="412" height="78" rx="21" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-opacity="0.72" stroke-dasharray="220 88" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-308" dur="22s" repeatCount="indefinite"/>
  </rect>
  <path d="M54 43H120" stroke="url(#edge)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 18" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="16s" repeatCount="indefinite"/>
  </path>
  <circle cx="54" cy="43" r="8" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="r" values="7;9;7" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="43" r="8" fill="#22c55e" filter="url(#glow)"/>
  <text x="154" y="34" class="meta">OPEN LAB NETWORK</text>
  <text x="154" y="61" class="label">Explore Labs</text>
  <text x="348" y="55" class="arrow">-&gt;</text>
</svg>
